<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Bot – Discona</title>
    {{ bootstrap.load_css() }}
    {{ bootstrap.load_js() }}
    <style>
        body {
            background: #f8f9fa;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body>
    <!-- Top navigation bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light w-100">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                🤵🤖👩
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">Bots</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('system') }}">System</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4 mt-5">
                    <h2 class="mb-4 text-center">Edit Bot</h2>
                    {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}
                    <form method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" name="name" required
                                value="{{ bot['name'] }}">
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description"
                                rows="3">{{ bot['description'] }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label for="backstory" class="form-label">Backstory</label>
                            <textarea class="form-control" id="backstory" name="backstory"
                                rows="4">{{ bot['backstory'] or '' }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label for="personality" class="form-label">Personality</label>
                            <textarea class="form-control" id="personality" name="personality"
                                rows="4">{{ bot['personality'] or '' }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label for="writing_sample" class="form-label">Writing Sample</label>
                            <textarea class="form-control" id="writing_sample" name="writing_sample"
                                rows="4">{{ bot['writing_sample'] or '' }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label for="trigger_words" class="form-label">Trigger Words</label>
                            <input type="text" class="form-control" id="trigger_words" name="trigger_words"
                                value="{{ bot['trigger_words'] or '' }}" placeholder="Comma separated">
                        </div>
                        <div class="mb-3">
                            <label for="activity_level" class="form-label">Activity Level</label>
                            <input type="number" class="form-control" id="activity_level" name="activity_level" min="0"
                                max="1" step="0.01" value="{{ bot['activity_level'] or '' }}" placeholder="0 to 1">
                        </div>
                        <div class="mb-3">
                            <label for="model_name" class="form-label">Model Name
                                <span class="text-muted">(optional — overrides system model)</span></label>
                            <input type="text" class="form-control" id="model_name" name="model_name"
                                value="{{ bot['model_name'] or '' }}" placeholder="e.g. llama-3-8b">
                        </div>
                        <div class="mb-3">
                            <label for="temperature" class="form-label">Temperature
                                <span class="text-muted">(optional — overrides system default)</span></label>
                            <input type="number" class="form-control" id="temperature" name="temperature" min="0"
                                max="2" step="0.1" value="{{ bot['temperature'] or '' }}" placeholder="e.g. 0.7">
                        </div>
                        <div class="mb-3">
                            <label for="discord_api_key" class="form-label">Discord API Key</label>
                            <input type="text" class="form-control" id="discord_api_key" name="discord_api_key"
                                value="{{ bot['discord_api_key'] or '' }}">
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
